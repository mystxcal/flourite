# Flourite configuration

[run]
adapter = "generic"
run_root = ".flourite/runs"

[kernel]
max_parallel = 1
# Optional operator-owned hard envelopes. Leave them unset to avoid an
# arbitrary harness horizon.
# max_wall_seconds = 7200
# max_input_tokens = 1000000
# max_output_tokens = 100000
# max_model_turns = 1000
# max_cost_usd = 100

[provider]
kind = "omp-codex"
command = "omp"
codex_auth_path = "~/.codex/auth.json"
provider_state_root = "~/.cache/flourite/provider"
default_model = "gpt-5.6-sol"
schema_attempts = 2
timeout_seconds = 1800
persist_lead_sessions = true
resume_lead_sessions = true
resume_fallback_to_reconstruction = true
default_network_access = true

[provider.capabilities]
mode = "trusted"
inherit_environment = true
discover_rules = false
discover_skills = false
discover_extensions = false
tools = ["read", "bash", "edit", "write", "grep", "glob", "lsp", "ast_edit", "debug", "eval", "browser", "task", "web_search"]
task_max_concurrency = 4
task_max_recursion_depth = 1
task_soft_request_budget = 80
task_max_runtime_ms = 900000
retry_max_retries = 6

[provider.strong]
model = "gpt-5.6-sol"
reasoning_effort = "xhigh"

[software]
preflight_checks = []
candidate_checks = []
checks = []
check_timeout_seconds = 900
include_untracked = true
apply_final_patch = false
release_artifacts = []
max_release_artifact_bytes = 250000000

[software.objective]
# command = "python evaluate.py --json"
primary_metric = "score"
direction = "maximize"
timeout_seconds = 900
